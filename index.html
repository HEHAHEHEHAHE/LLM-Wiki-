<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>AI Video-to-Wiki Knowledge Base</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="AI Engineering, Autonomous Agents & Software Factory 影音知識庫">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Docsify 主題 -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <!-- KaTeX CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  
  <!-- 防止快取過期 -->
  <script>
    (function() {
      var origOpen = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function(method, url) {
        if (typeof url === 'string' && (url.indexOf('.md') !== -1 || url.indexOf('_sidebar') !== -1)) {
          var sep = url.indexOf('?') === -1 ? '?' : '&';
          url = url + sep + '_t=' + Date.now();
        }
        return origOpen.apply(this, [method, url].concat(Array.prototype.slice.call(arguments, 2)));
      };
    })();
  </script>
  
  <style>
    :root {
      --theme-color: #0284c7;
      --sidebar-width: 290px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      color: #1e293b;
      line-height: 1.7;
    }
    .markdown-section h1 {
      font-size: 1.9rem;
      font-weight: 600;
      color: #0f172a;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 0.4em;
    }
    .markdown-section h2 {
      font-size: 1.45rem;
      font-weight: 600;
      color: #1e293b;
      margin-top: 1.6em;
      border-bottom: 1px solid #f1f5f9;
      padding-bottom: 0.2em;
    }
    .markdown-section h3 {
      font-size: 1.2rem;
      font-weight: 600;
      color: #334155;
    }
    .markdown-section blockquote {
      border-left: 3px solid #0284c7;
      background: #f0f9ff;
      color: #0369a1;
      padding: 10px 16px;
      margin: 1em 0;
    }
    .markdown-section table {
      border-collapse: collapse;
      width: 100%;
      margin: 1.2em 0;
    }
    .markdown-section th, .markdown-section td {
      border: 1px solid #cbd5e1;
      padding: 8px 12px;
      text-align: left;
    }
    .markdown-section th {
      background: #f8fafc;
      font-weight: 600;
    }
    .sidebar {
      background-color: #fafbfc;
      border-right: 1px solid #eaecef;
    }
    .app-name {
      font-size: 1.05rem;
      font-weight: 600;
      color: #0f172a;
      padding: 16px 0 8px 0;
    }
  </style>
</head>
<body>
  <div id="app">載入中...</div>
  <script>
    window.$docsify = {
      name: 'AI Video-to-Wiki',
      repo: '',
      loadSidebar: '_sidebar.md',
      homepage: 'wiki/index.md',
      auto2top: true,
      subMaxLevel: 3,
      sidebarDisplayLevel: 2,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '搜尋影片、概念、架構...',
        noData: '查無結果',
        depth: 4
      },
      plugins: [
        function(hook) {
          hook.afterEach(function(html) {
            html = html.replace(/\$\$([\s\S]*?)\$\$/g, function(match, tex) {
              try {
                return katex.renderToString(tex.trim(), { displayMode: true, throwOnError: false });
              } catch(e) {
                return '<span style="color:red">' + e.message + '</span>';
              }
            });
            html = html.replace(/\$([^\$\n]+?)\$/g, function(match, tex) {
              if (tex.indexOf('<') !== -1 || tex.indexOf('>') !== -1) return match;
              try {
                return katex.renderToString(tex.trim(), { displayMode: false, throwOnError: false });
              } catch(e) {
                return '<span style="color:red">' + e.message + '</span>';
              }
            });
            return html;
          });
        }
      ]
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
</body>
</html>
